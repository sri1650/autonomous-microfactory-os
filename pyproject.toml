[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-microfactory-os"
version = "0.1.0"
description = "Portfolio-grade autonomous microfactory orchestration and robotics software"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "PyYAML>=6.0", "numpy>=2.0", "opencv-python-headless>=4.10", "opentelemetry-api>=1.28", "protobuf>=6.31.1,<6.34", "grpcio>=1.70", "ortools>=9.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "opentelemetry-sdk>=1.28", "grpcio-tools>=1.76,<1.77", "httpx2>=2.0"]
vision = ["onnxruntime>=1.20"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
